name: SQLite CI - Linux (musl)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      sqlite_version:
        description: SQLite version to build (blank means latest)
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      sqlite_version:
        description: SQLite version to build (blank means latest)
        required: false
        type: string
        default: ''
      source_artifact:
        description: Verified SQLite source artifact from the caller workflow
        required: false
        type: string
        default: ''

jobs:
  build:
    name: Build and test - Linux/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            runner: ubuntu-latest
            platform: linux/386
            toolchain: alpine
          - arch: x86_64
            runner: ubuntu-latest
            platform: linux/amd64
            toolchain: alpine
            qemu-platform: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            toolchain: alpine
          - arch: arm
            runner: ubuntu-latest
            platform: linux/arm/v7
            toolchain: alpine
          - arch: mips64el
            runner: ubuntu-latest
            toolchain: zig
            target: mips64el-linux-muslabi64
            qemu: qemu-mips64el-static
          - arch: loong64
            runner: ubuntu-latest
            toolchain: zig
            target: loongarch64-linux-musl
            qemu: qemu-loongarch64-static

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Download verified SQLite source artifact
        if: inputs.source_artifact != ''
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ inputs.source_artifact }}
          path: ${{ github.workspace }}

      - name: Download SQLite amalgamation
        if: inputs.source_artifact == ''
        env:
          SQLITE_VERSION: ${{ inputs.sqlite_version }}
        run: |
          if [ -n "$SQLITE_VERSION" ]; then
            python3 scripts/download_sqlite.py --version "$SQLITE_VERSION"
          else
            python3 scripts/download_sqlite.py
          fi

      - name: Set up QEMU
        if: matrix.arch == 'x86' || matrix.arch == 'arm'
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: 386,arm

      - name: Set up Zig
        if: matrix.toolchain == 'zig'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zig-linux-x86_64-0.17.0.tar.xz"
          curl -fsSL https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz -o "$archive"
          echo "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026  $archive" | sha256sum --check
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.17.0" >> "$GITHUB_PATH"

      - name: Set up QEMU user-mode emulation
        if: matrix.toolchain == 'zig'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-user-static
          command -v "${{ matrix.qemu }}"
          "${{ matrix.qemu }}" --version

      - name: Compile static sqlite3 inside Alpine
        if: matrix.toolchain == 'alpine'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            --platform ${{ matrix.platform }} \
            alpine:latest \
            sh -c '
              set -e
              apk add --no-cache build-base
              gcc -Os -static \
                -DSQLITE_ENABLE_FTS5 \
                -DSQLITE_ENABLE_JSON1 \
                -DSQLITE_ENABLE_RTREE \
                shell.c sqlite3.c \
                -o sqlite3-linux-${{ matrix.arch }} \
                -lpthread -ldl -lm
            '

      - name: Cross-compile static sqlite3 with Zig
        if: matrix.toolchain == 'zig'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          zig cc -target "$TARGET" -Os -static \
            -DSQLITE_ENABLE_FTS5 \
            -DSQLITE_ENABLE_JSON1 \
            -DSQLITE_ENABLE_RTREE \
            shell.c sqlite3.c \
            -o "sqlite3-linux-${{ matrix.arch }}" \
            -lpthread -ldl -lm

      - name: Verify static linkage
        run: |
          file sqlite3-linux-${{ matrix.arch }}
          if file sqlite3-linux-${{ matrix.arch }} | grep -Eq "statically linked|static-pie linked"; then
            echo "Binary is statically linked"
          else
            echo "Binary is NOT statically linked"
            exit 1
          fi

      - name: Smoke test in target Alpine
        if: matrix.toolchain == 'alpine'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            --platform ${{ matrix.platform }} \
            alpine:latest \
            sh -c '
              set -eu
              version=$(./sqlite3-linux-${{ matrix.arch }} --version)
              printf "%s\n" "$version"
              test -n "$version"
              sqlite_version=${version%% *}
              query=$(./sqlite3-linux-${{ matrix.arch }} ":memory:" "SELECT sqlite_version();")
              printf "SQLite query result: %s\n" "$query"
              test "$query" = "$sqlite_version"
            '

      - name: Smoke test under QEMU
        if: matrix.toolchain == 'zig'
        run: |
          set -eu
          version=$("${{ matrix.qemu }}" "./sqlite3-linux-${{ matrix.arch }}" --version)
          printf "%s\n" "$version"
          test -n "$version"
          sqlite_version=${version%% *}
          query=$("${{ matrix.qemu }}" "./sqlite3-linux-${{ matrix.arch }}" ":memory:" "SELECT sqlite_version();")
          printf "SQLite query result: %s\n" "$query"
          test "$query" = "$sqlite_version"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sqlite3-static-${{ matrix.arch }}
          path: sqlite3-linux-${{ matrix.arch }}
          if-no-files-found: error
