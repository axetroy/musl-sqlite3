name: Build Static SQLite3 (Alpine + musl)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build sqlite3 for ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            platform: linux/386
            qemu-platform: 386
          - arch: x86_64
            platform: linux/amd64
            qemu-platform: amd64
          - arch: arm64
            platform: linux/arm64
            qemu-platform: arm64

    steps:
      - name: Download latest SQLite amalgamation
        run: |
          python3 - <<'PY'
          import csv
          import hashlib
          import io
          import re
          import shutil
          import urllib.request
          import zipfile

          download_page = "https://www.sqlite.org/download.html"
          request = urllib.request.Request(
              download_page,
              headers={"User-Agent": "sqlite-musl-build/1.0"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              page = response.read().decode("utf-8")

          metadata = re.search(
              r"<!-- Download product data for scripts to read\s*(.*?)\s*-->",
              page,
              re.DOTALL,
          )
          if metadata is None:
              raise SystemExit("SQLite download metadata was not found")

          rows = csv.DictReader(io.StringIO(metadata.group(1)))
          releases = [
              row for row in rows
              if re.fullmatch(
                  r"\d{4}/sqlite-amalgamation-\d+\.zip",
                  row.get("RELATIVE-URL", ""),
              )
          ]
          if not releases:
              raise SystemExit("No SQLite amalgamation archive was listed")

          release = max(
              releases,
              key=lambda row: int(
                  re.search(r"-(\d+)\.zip$", row["RELATIVE-URL"]).group(1)
              ),
          )
          archive_url = "https://www.sqlite.org/" + release["RELATIVE-URL"]
          with urllib.request.urlopen(archive_url, timeout=60) as response:
              archive_data = response.read()

          if len(archive_data) != int(release["SIZE-IN-BYTES"]):
              raise SystemExit("SQLite archive size does not match published metadata")
          archive_hash = hashlib.sha3_256(archive_data).hexdigest()
          if archive_hash.lower() != release["SHA3-HASH"].lower():
              raise SystemExit("SQLite archive SHA3-256 does not match published metadata")

          archive_name = release["RELATIVE-URL"].rsplit("/", 1)[-1]
          archive_root = archive_name.removesuffix(".zip")
          required_files = ("shell.c", "sqlite3.c", "sqlite3.h")
          with zipfile.ZipFile(io.BytesIO(archive_data)) as archive:
              for filename in required_files:
                  member = f"{archive_root}/{filename}"
                  if member not in archive.namelist():
                      raise SystemExit(f"SQLite archive is missing {filename}")
                  with archive.open(member) as source, open(filename, "wb") as target:
                      shutil.copyfileobj(source, target)

          print(f"Downloaded and verified SQLite {release['VERSION']} ({archive_name})")
          PY

      - name: Set up QEMU
        if: matrix.arch != 'x86_64'
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: ${{ matrix.qemu-platform }}

      - name: Compile static sqlite3 inside Alpine
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            --platform ${{ matrix.platform }} \
            alpine:latest \
            sh -c '
              set -e
              apk add --no-cache build-base
              gcc -Os -static \
                -DSQLITE_ENABLE_FTS5 \
                -DSQLITE_ENABLE_JSON1 \
                -DSQLITE_ENABLE_RTREE \
                shell.c sqlite3.c \
                -o sqlite3-linux-${{ matrix.arch }} \
                -lpthread -ldl -lm
            '

      - name: Verify static linkage
        run: |
          file sqlite3-linux-${{ matrix.arch }}
          if file sqlite3-linux-${{ matrix.arch }} | grep -q "statically linked"; then
            echo "Binary is statically linked"
          else
            echo "Binary is NOT statically linked"
            exit 1
          fi

      - name: Smoke test (x86_64 only)
        if: matrix.arch == 'x86_64'
        run: ./sqlite3-linux-x86_64 --version

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sqlite3-static-${{ matrix.arch }}
          path: sqlite3-linux-${{ matrix.arch }}
          if-no-files-found: error
