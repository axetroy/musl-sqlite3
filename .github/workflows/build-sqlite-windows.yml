name: SQLite CI - Windows

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      sqlite_version:
        description: SQLite version to build (blank means latest)
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      sqlite_version:
        description: SQLite version to build (blank means latest)
        required: false
        type: string
        default: ''
  push:
    paths:
      - '.github/workflows/build-sqlite-*.yml'
      - '.github/workflows/release-sqlite.yml'
      - 'scripts/**'

jobs:
  build:
    name: Build and test - Windows/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            runner: windows-latest
            generator-arch: Win32
            expected-machine: '14C machine (x86)'
          - arch: x86_64
            runner: windows-latest
            generator-arch: x64
            expected-machine: '8664 machine (x64)'
          - arch: arm64
            runner: windows-11-arm
            generator-arch: ARM64
            expected-machine: 'AA64 machine (ARM64)'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Download SQLite amalgamation
        env:
          SQLITE_VERSION: ${{ inputs.sqlite_version }}
        run: |
          if ($env:SQLITE_VERSION) {
            python scripts/download_sqlite.py --version $env:SQLITE_VERSION
          } else {
            python scripts/download_sqlite.py
          }
          if ($LASTEXITCODE -ne 0) { throw "SQLite source download failed" }

      - name: Build with the static MSVC runtime
        env:
          SQLITE_ARCH: ${{ matrix.arch }}
          GENERATOR_ARCH: ${{ matrix.generator-arch }}
        run: |
          $vswhereCandidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'),
            (Join-Path $env:ProgramFiles 'Microsoft Visual Studio\Installer\vswhere.exe')
          )
          $vswhere = $vswhereCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $vswhere) { throw "vswhere.exe was not found" }

          $version = & $vswhere -latest -products '*' -property installationVersion
          $majorVersion = [int]($version.Split('.')[0])
          $generator = switch ($majorVersion) {
            17 { 'Visual Studio 17 2022' }
            18 { 'Visual Studio 18 2026' }
            default { throw "Unsupported Visual Studio version: $version" }
          }

          cmake -S scripts/windows -B build/windows `
            -G $generator `
            -A $env:GENERATOR_ARCH
          if ($LASTEXITCODE -ne 0) { throw "CMake configuration failed" }
          cmake --build build/windows --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "SQLite build failed" }
          Copy-Item build/windows/Release/sqlite3.exe "sqlite3-windows-$env:SQLITE_ARCH.exe"

      - name: Verify architecture and runtime dependencies
        env:
          SQLITE_ARCH: ${{ matrix.arch }}
          EXPECTED_MACHINE: ${{ matrix.expected-machine }}
        run: |
          $vswhereCandidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'),
            (Join-Path $env:ProgramFiles 'Microsoft Visual Studio\Installer\vswhere.exe')
          )
          $vswhere = $vswhereCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $vswhere) { throw "vswhere.exe was not found" }
          $vsPath = & $vswhere -latest -products '*' -property installationPath
          if (-not $vsPath) { throw "Visual Studio C++ tools were not found" }

          $msvcPath = Join-Path $vsPath 'VC\Tools\MSVC'
          $dumpbin = $null
          $hostTargets = @(
            'Hostx64\x64',
            'Hostx64\arm64',
            'Hostx64\x86',
            'HostARM64\arm64',
            'HostARM64\x64',
            'HostARM64\x86'
          )
          foreach ($toolset in (Get-ChildItem $msvcPath -Directory | Sort-Object Name -Descending)) {
            foreach ($hostTarget in $hostTargets) {
              $candidate = Join-Path $toolset.FullName "bin\$hostTarget\dumpbin.exe"
              if (Test-Path $candidate) {
                $dumpbin = $candidate
                break
              }
            }
            if ($dumpbin) { break }
          }
          if (-not $dumpbin) { throw "dumpbin.exe was not found" }

          $binary = "sqlite3-windows-$env:SQLITE_ARCH.exe"
          $headers = & $dumpbin /headers $binary | Out-String
          if ($LASTEXITCODE -ne 0 -or $headers -notmatch [regex]::Escape($env:EXPECTED_MACHINE)) {
            throw "Binary machine type does not match $env:SQLITE_ARCH"
          }

          $dependencies = & $dumpbin /dependents $binary | Out-String
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect binary dependencies" }
          Write-Output $dependencies
          if ($dependencies -match '(?i)(VCRUNTIME.*\.dll|MSVCP.*\.dll|UCRTBASE\.dll|api-ms-win-crt-.*\.dll|libgcc_s|libwinpthread)') {
            throw "Binary has a dynamic C/C++ runtime dependency; /MT is required"
          }

      - name: Smoke test on Windows
        env:
          SQLITE_ARCH: ${{ matrix.arch }}
          SQLITE_VERSION: ${{ inputs.sqlite_version }}
        run: |
          $binary = ".\sqlite3-windows-$env:SQLITE_ARCH.exe"
          $version = & $binary --version
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace(($version -join ' '))) {
            throw "SQLite --version smoke test failed"
          }
          Write-Output $version

          $query = & $binary ':memory:' 'SELECT sqlite_version();'
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace(($query -join ' '))) {
            throw "SQLite query smoke test failed"
          }
          Write-Output "SQLite query result: $query"
          if (($version -split '\s+')[0] -ne $query.Trim()) {
            throw "CLI and SQL query report different SQLite versions"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sqlite3-windows-${{ matrix.arch }}
          path: sqlite3-windows-${{ matrix.arch }}.exe
          if-no-files-found: error
