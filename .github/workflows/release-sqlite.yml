name: SQLite Release

on:
  schedule:
    - cron: '17 2 * * 1'
  push:
    paths:
      - '.github/workflows/build-sqlite-*.yml'
      - '.github/workflows/ci-sqlite.yml'
      - '.github/workflows/release-sqlite.yml'
      - 'scripts/**'
      - 'tests/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check for a new version without building or publishing
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sqlite-release
  cancel-in-progress: false

jobs:
  check:
    name: Check - SQLite version
    runs-on: ubuntu-latest
    outputs:
      sqlite_version: ${{ steps.check.outputs.sqlite_version }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Test CI helper scripts
        run: python3 -m unittest discover -s tests

      - name: Require default branch for manual publishing
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "::error::Manual releases must run from the repository's default branch"
          exit 1

      - name: Check upstream version and existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_sqlite_update.py

  prepare-source:
    name: Prepare verified SQLite source
    needs: check
    if: >-
      needs.check.outputs.should_release == 'true' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Download and verify pinned SQLite amalgamation
        env:
          SQLITE_VERSION: ${{ needs.check.outputs.sqlite_version }}
        run: python3 scripts/download_sqlite.py --version "$SQLITE_VERSION"

      - name: Upload verified SQLite source
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sqlite-source
          path: |
            shell.c
            sqlite3.c
            sqlite3.h
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Build and test - Linux artifacts (SQLite ${{ needs.check.outputs.sqlite_version }})
    needs:
      - check
      - prepare-source
    if: >-
      needs.check.outputs.should_release == 'true' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
    uses: ./.github/workflows/build-sqlite-musl.yml
    with:
      sqlite_version: ${{ needs.check.outputs.sqlite_version }}
      source_artifact: sqlite-source
    permissions:
      contents: read

  build-macos:
    name: Build and test - macOS artifacts (SQLite ${{ needs.check.outputs.sqlite_version }})
    needs:
      - check
      - prepare-source
    if: >-
      needs.check.outputs.should_release == 'true' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
    uses: ./.github/workflows/build-sqlite-macos.yml
    with:
      sqlite_version: ${{ needs.check.outputs.sqlite_version }}
      source_artifact: sqlite-source
    permissions:
      contents: read

  build-windows:
    name: Build and test - Windows artifacts (SQLite ${{ needs.check.outputs.sqlite_version }})
    needs:
      - check
      - prepare-source
    if: >-
      needs.check.outputs.should_release == 'true' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
    uses: ./.github/workflows/build-sqlite-windows.yml
    with:
      sqlite_version: ${{ needs.check.outputs.sqlite_version }}
      source_artifact: sqlite-source
    permissions:
      contents: read

  release:
    name: Publish - GitHub Release
    needs:
      - check
      - build-linux
      - build-macos
      - build-windows
    if: >-
      needs.check.outputs.should_release == 'true' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Download verified platform artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: sqlite3-*
          path: release-assets
          merge-multiple: true

      - name: Verify assets and create checksums
        run: |
          set -euo pipefail
          for binary in \
            sqlite3-linux-x86 \
            sqlite3-linux-x86_64 \
            sqlite3-linux-arm \
            sqlite3-linux-arm64 \
            sqlite3-linux-mips64el \
            sqlite3-linux-loong64 \
            sqlite3-macos-universal2 \
            sqlite3-windows-x86.exe \
            sqlite3-windows-x86_64.exe \
            sqlite3-windows-arm64.exe; do
            if [ ! -s "release-assets/${binary}" ]; then
              echo "::error::Missing or empty binary: ${binary}"
              exit 1
            fi
          done
          (
            cd release-assets
            sha256sum \
              sqlite3-linux-x86 \
              sqlite3-linux-x86_64 \
              sqlite3-linux-arm \
              sqlite3-linux-arm64 \
              sqlite3-linux-mips64el \
              sqlite3-linux-loong64 \
              sqlite3-macos-universal2 \
              sqlite3-windows-x86.exe \
              sqlite3-windows-x86_64.exe \
              sqlite3-windows-arm64.exe \
              > SHA256SUMS
          )

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
          SQLITE_VERSION: ${{ needs.check.outputs.sqlite_version }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Standalone SQLite CLI binaries for SQLite ${SQLITE_VERSION}.

          Linux: x86, x86_64, arm, arm64, mips64el, and loong64, statically linked with musl.
          macOS: universal2 (x86_64 and arm64), with SQLite statically included;
          depends only on macOS system libraries.
          Windows: x86, x86_64, and arm64, with the MSVC runtime statically linked (/MT);
          depends on Windows system DLLs.

          Every binary passed a platform smoke test including a SQLite version
          query. Verify downloaded files with \`SHA256SUMS\`.
          EOF
          gh release create "$RELEASE_TAG" release-assets/* \
            --title "SQLite ${SQLITE_VERSION} standalone CLI binaries" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --target "$GITHUB_SHA"
