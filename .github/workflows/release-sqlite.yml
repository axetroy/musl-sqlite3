name: Check and Release SQLite

on:
  schedule:
    - cron: '17 2 * * 1'
  push:
    paths:
      - '.github/workflows/build-sqlite-musl.yml'
      - '.github/workflows/release-sqlite.yml'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check for a new version without building or publishing
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sqlite-release
  cancel-in-progress: false

jobs:
  check:
    name: Check for a new SQLite version
    runs-on: ubuntu-latest
    outputs:
      sqlite_version: ${{ steps.check.outputs.sqlite_version }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Require default branch for manual publishing
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "::error::Manual releases must run from the repository's default branch"
          exit 1

      - name: Check upstream version and existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_sqlite_update.py

  build:
    name: Build and test SQLite ${{ needs.check.outputs.sqlite_version }}
    needs: check
    if: >-
      needs.check.outputs.should_release == 'true' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
    uses: ./.github/workflows/build-sqlite-musl.yml
    with:
      sqlite_version: ${{ needs.check.outputs.sqlite_version }}
    permissions:
      contents: read

  release:
    name: Publish GitHub Release
    needs:
      - check
      - build
    if: >-
      needs.check.outputs.should_release == 'true' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Download verified architecture artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: sqlite3-static-*
          path: release-assets
          merge-multiple: true

      - name: Verify assets and create checksums
        run: |
          set -euo pipefail
          for arch in x86 x86_64 arm64; do
            if [ ! -s "release-assets/sqlite3-linux-${arch}" ]; then
              echo "::error::Missing or empty binary for ${arch}"
              exit 1
            fi
          done
          (
            cd release-assets
            sha256sum sqlite3-linux-* > SHA256SUMS
          )

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
          SQLITE_VERSION: ${{ needs.check.outputs.sqlite_version }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Static musl-linked SQLite CLI binaries for SQLite ${SQLITE_VERSION}.

          Architectures: x86 (32-bit), x86_64, and arm64.

          Each binary was executed in its matching Alpine environment and passed
          a SQLite version query. Verify downloaded files with \`SHA256SUMS\`.
          EOF
          gh release create "$RELEASE_TAG" release-assets/* \
            --title "SQLite ${SQLITE_VERSION} static Linux binaries" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --target "$GITHUB_SHA"
